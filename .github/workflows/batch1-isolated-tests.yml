name: Batch 1 isolated tests (blocked by protected import boundary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why Batch 1 execution is blocked
        run: |
          echo "::error::Batch 1 test execution is blocked because its current sparse checkout includes protected validator.py/report.py and its test imports reach those modules."
          echo "No checkout, protected file access, test execution, network request, or exchange call occurred."
          echo "Resume only after the owner separately authorizes the exact protected-module scope or the tests are redesigned to avoid those imports."
          exit 1
