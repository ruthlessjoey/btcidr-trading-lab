name: Batch 1 isolated offline tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch1-isolated-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Sparse checkout of the approved test surface only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetcher.py
            /transport_policy.py
            /markets/__init__.py
            /markets/candles.py
            /markets/providers/__init__.py
            /markets/providers/errors.py
            /markets/providers/normalize.py
            /markets/providers/transport.py
            /providers.py
            /live_check.py
            /run.py
            /probe.py
            /signal/btc_signal.py
            /signal/fetch_latest.py
            /signal/test_btc_signal.py
            /signal/test_fetch_latest.py
            /report.py
            /validator.py
            /research/__init__.py
            /research/crosscheck.py
            /research/history.py
            /research/dataset.py
            /research/data_report.py
            /tests/test_transport_policy.py
            /tests/test_fetcher.py
            /tests/test_live_check.py
            /tests/test_probe.py
            /tests/test_pipeline.py
            /tests/test_research_sanitization.py

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Run Batch 1 offline regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_transport_policy.py' -v
          python -m unittest discover -s tests -p 'test_fetcher.py' -v
          python -m unittest discover -s tests -p 'test_live_check.py' -v
          python -m unittest discover -s tests -p 'test_probe.py' -v
          python -m unittest discover -s tests -p 'test_pipeline.py' -v
          python -m unittest discover -s signal -p 'test_fetch_latest.py' -v
          python -m unittest discover -s tests -p 'test_research_sanitization.py' -v
