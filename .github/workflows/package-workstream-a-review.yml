name: Package Workstream A review snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch only the approved files at the pinned Workstream A commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import PurePosixPath

          OWNER = "ruthlessjoey"
          REPO = "btcidr-trading-lab"
          REF = "3433bcb12f7a50128e6fd32f71dedc96fbacdf48"
          FILES = (
              ".github/workflows/research-backtest.yml",
              ".github/workflows/manual-offline-unit-tests.yml",
              "backtest_config.json",
              "run_backtest.py",
              "run_crosscheck.py",
              "research/__init__.py",
              "research/backtest_report.py",
              "research/crosscheck.py",
              "research/data_report.py",
              "research/dataset.py",
              "research/engine.py",
              "research/history.py",
              "research/holdout_publish.py",
              "research/pipeline.py",
              "research/selection.py",
              "research/splits.py",
              "research/strategy.py",
              "research/toy.py",
              "tests/test_backtest_pipeline.py",
              "tests/test_engine.py",
              "tests/test_history.py",
              "tests/test_holdout_publish.py",
              "tests/test_holdout_reporting.py",
              "tests/test_research_sanitization.py",
              "tests/test_selection_warmup.py",
          )
          PROTECTED = ("P1/", "signal/data/")
          assert len(FILES) == 25 and len(set(FILES)) == len(FILES)
          for name in FILES:
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or name.startswith(PROTECTED):
                  raise SystemExit("Unsafe allowlist path rejected")

          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{OWNER}/{REPO}/contents/"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "workstream-a-review-packager",
          }
          archive_path = os.path.join(os.environ["RUNNER_TEMP"], "workstream-a-review.zip")
          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for name in FILES:
                  url = api + urllib.parse.quote(name, safe="/") + "?ref=" + REF
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      item = json.load(response)
                  if item.get("type") != "file" or item.get("path") != name:
                      raise SystemExit(f"Expected regular file at exact allowlist path: {name}")
                  if item.get("encoding") != "base64" or not item.get("content"):
                      raise SystemExit(f"Unexpected API encoding or empty content: {name}")
                  raw = base64.b64decode(item["content"], validate=False)
                  blob = b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw
                  actual_sha = hashlib.sha1(blob).hexdigest()
                  if actual_sha != item.get("sha"):
                      raise SystemExit(f"Git blob SHA mismatch: {name}")
                  archive.writestr("btcidr-trading-lab/" + name, raw)

          with zipfile.ZipFile(archive_path, "r") as archive:
              names = archive.namelist()
              expected = {"btcidr-trading-lab/" + name for name in FILES}
              if len(names) != 25 or set(names) != expected:
                  raise SystemExit("Archive contents differ from the exact 25-file allowlist")
              if any(name.startswith("btcidr-trading-lab/" + p) for name in names for p in PROTECTED):
                  raise SystemExit("Protected path unexpectedly present in archive")
          print(f"Created {archive_path} with exactly {len(FILES)} allowlisted files from {REF}")
          PY

      - name: Upload review ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workstream-a-review-3433bcb
          path: ${{ runner.temp }}/workstream-a-review.zip
          if-no-files-found: error
          retention-days: 1
