name: Specialist Army Review

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Synthetic policy smoke test first; scoped PR #56 review only after it passes"
        required: true
        type: choice
        options:
          - synthetic
          - review
        default: synthetic

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: specialist-army-review
  cancel-in-progress: false

jobs:
  review:
    name: Bounded read-only review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the immutable trusted runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0a6ce0bae5e78dfc68a99cff42bbf3bcec240b69
          path: runner
          persist-credentials: false

      - name: Verify runner syntax
        run: python -m py_compile runner/tools/specialist_army_review.py

      - name: Run synthetic smoke test
        if: inputs.mode == 'synthetic'
        run: python runner/tools/specialist_army_review.py --mode synthetic

      - name: Run the immutable PR #56 specialist review
        if: inputs.mode == 'review'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python runner/tools/specialist_army_review.py --mode review
