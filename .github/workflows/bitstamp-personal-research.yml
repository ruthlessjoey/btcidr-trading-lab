name: Bitstamp personal research only

on:
  push:
    branches:
      - research/bitstamp-public-ohlc-personal-2026-11-27
      - research/fix-bitstamp-preregistered-end-boundary-2026-11-27
      - research/bitstamp-conservative-intrabar-drawdown-2026-11-27
      - research/bitstamp-terminal-mark-to-market-label-2026-11-27
      - research/reset-state-at-bitstamp-segment-boundaries-2026-11-27
      - research/bitstamp-integrated-state-rsi-identity-2026-11-27
      - research/fail-closed-multifold-promotion-gate-2026-11-27
      - research/five-fold-walk-forward-execution-2026-11-27
      - research/paired-bootstrap-deflated-sharpe-2026-11-27
      - research/reserve-untouched-final-holdout-2026-11-27
      - research/integrate-walkforward-statistical-promotion-2026-11-27
      - research/global-trial-dsr-universe-2026-11-27
      - research/append-only-trial-registry-2026-11-27
      - security/integrate-pit-universe-gate-with-global-dsr-2026-11-27
      - research/require-aligned-global-oos-fold-calendar-2026-11-27
      - research/integrated-oos-calendar-execution-sensitivity-2026-11-27
      - security/enforce-append-only-trial-ledger-history-2026-11-27
    paths:
      - "research/bitstamp_personal/**"
      - ".github/workflows/bitstamp-personal-research.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/bitstamp_personal/**"
      - ".github/workflows/bitstamp-personal-research.yml"
  workflow_dispatch:
    inputs:
      allow_public_data_request:
        description: "Explicitly authorize one unauthenticated public Bitstamp research run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bitstamp-personal-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Sparse checkout research-only files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/bitstamp_personal

      - name: Set up supported Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Verify trial registry is append-only against the PR base / previous push
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASE_FILE="$RUNNER_TEMP/experiment_registry_base.jsonl"
          : > "$BASE_FILE"
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git cat-file -e "FETCH_HEAD:research/bitstamp_personal/experiment_registry.jsonl" 2>/dev/null; then
              git show "FETCH_HEAD:research/bitstamp_personal/experiment_registry.jsonl" > "$BASE_FILE"
            fi
          fi
          python research/bitstamp_personal/verify_append_only_registry.py \
            "$BASE_FILE" research/bitstamp_personal/experiment_registry.jsonl

      - name: Run offline provider, pagination and strategy tests
        run: python -m unittest discover -s research/bitstamp_personal -p 'test_*.py' -v

  public-research:
    if: github.event_name == 'workflow_dispatch' && inputs.allow_public_data_request == true
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Sparse checkout research-only files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/bitstamp_personal

      - name: Set up latest Python 3.13 patch
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Run approved personal noncommercial research (no dataset artifacts)
        run: >-
          python research/bitstamp_personal/research_runner.py
          --start 2024-01-01
          --end 2026-11-01
          --min-markets 3
          --require-meme

      # Intentionally no upload-artifact step: raw provider data must not be redistributed.
