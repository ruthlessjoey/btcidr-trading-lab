name: Market data check

on:
  workflow_dispatch:        # manual run for the non-Tokocrypto public-provider checks
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"    # once a day (GitHub may start it late)

permissions:
  contents: read

jobs:
  test-probe-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Live smoke test - approved public providers (READ-ONLY)
        # Tokocrypto is intentionally excluded from scheduled and push-triggered checks.
        run: python3 live_check.py

      - name: Keep the reports and candle file
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-data-report
          path: out/
          if-no-files-found: ignore
