name: Market data check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-market-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check only the explicitly approved Tokocrypto public time and candle routes
        run: python3 live_check.py

      - name: Keep reports and candle file as a run artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-report
          path: out/
          if-no-files-found: ignore
