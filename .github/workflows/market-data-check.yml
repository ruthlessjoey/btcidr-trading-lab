name: Market data check

on:
  workflow_dispatch:        # manual diagnostics are available only when explicitly requested
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"    # once a day (GitHub may start it late)

permissions:
  contents: read

jobs:
  test-probe-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Live smoke test - real candles from each public provider (READ-ONLY)
        # This is the REQUIRED live check. It fails the run if no provider delivers validated data.
        run: python3 live_check.py

      - name: Manual Tokocrypto diagnostic
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python3 probe.py
          python3 run.py

      - name: Keep the reports and candle file
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-data-report
          path: out/
          if-no-files-found: ignore
