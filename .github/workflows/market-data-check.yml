name: Market data check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-market-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run authorized offline tests only (no protected validator import)
        run: |
          python3 -m unittest discover -s tests -p 'test_fetcher.py' -v
          python3 -m unittest discover -s tests -p 'test_live_check.py' -v
          python3 -m unittest discover -s tests -p 'test_history.py' -v
          python3 -m unittest discover -s tests -p 'test_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_pipeline.py' -v

      - name: Check only the explicitly approved Tokocrypto public time and candle routes
        run: python3 live_check.py

      - name: Keep reports and candle file as a run artifact only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-data-report
          path: out/
          if-no-files-found: ignore
