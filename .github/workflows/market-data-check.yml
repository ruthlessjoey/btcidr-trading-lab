name: Market data check

on:
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"    # once a day (GitHub may start it late)

permissions:
  contents: write           # only used to publish reports to the 'data' branch

jobs:
  test-probe-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Live smoke test - real candles from each public provider (READ-ONLY)
        # This is the REQUIRED live check. It fails the run if no provider delivers validated data.
        run: python3 live_check.py

      - name: Diagnostic - Tokocrypto only (expected to be refused from GitHub, see report)
        if: always()
        continue-on-error: true
        run: |
          python3 probe.py
          python3 run.py

      - name: Diagnostic - reachability lab (which public hosts answer from GitHub?)
        if: always()
        continue-on-error: true
        run: python3 tools/net_lab.py

      - name: Keep the reports and candle file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-report
          path: out/
          if-no-files-found: ignore

      - name: Publish reports to the data branch (readable without Actions logs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp -r out/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Reports from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
