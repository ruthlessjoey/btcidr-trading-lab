name: Market data check (blocked pending protected validator review)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why live market diagnostics are disabled
        run: |
          echo "::error::Live diagnostics are blocked because live_check.py imports protected validator.py/report.py. This workflow must not check out or execute those modules."
          echo "No checkout, test, protected file access, network request, or exchange call occurred."
          echo "Resume only after the protected module boundary is separately reviewed and authorized."
          exit 1
