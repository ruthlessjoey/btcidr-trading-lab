name: Market data check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-data-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-market-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify operational provider allowlist
        run: |
          python3 - <<'PY'
          import json
          with open("config.json", encoding="utf-8") as f:
              config = json.load(f)
          expected = ["kraken", "binance-vision"]
          if config.get("mode") != "read_only":
              raise SystemExit("Refusing: market-data mode must be read_only")
          if config.get("live_providers") != expected:
              raise SystemExit("Refusing: live provider list differs from the approved operational allowlist")
          PY

      - name: Run read-only public market-data check
        run: python3 live_check.py

      - name: Retain report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-data-report
          path: out/
          if-no-files-found: ignore
          retention-days: 7
