name: Research dataset (Step 1 gate)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run authorized offline tests (no protected validator import)
        run: |
          python3 -m unittest discover -s tests -p 'test_fetcher.py' -v
          python3 -m unittest discover -s tests -p 'test_live_check.py' -v
          python3 -m unittest discover -s tests -p 'test_history.py' -v
          python3 -m unittest discover -s tests -p 'test_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_research_gates.py' -v
          python3 -m unittest discover -s tests -p 'test_backtest_pipeline.py' -v

      - name: Fetch and validate history from the approved public endpoint
        run: python3 fetch_history.py

      - name: Keep reports and dataset as a run artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-report
          path: out/
          if-no-files-found: ignore
