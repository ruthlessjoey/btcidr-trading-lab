name: Q0.8 resume current PR 60 review from quota checkpoint d4edb4b

on:
  push:
    branches:
      - security/q08-push-checkpoint-resume-2026-11-22
    paths:
      - .github/workflows/q08-resume-checkpoint-44972690441.yml

permissions:
  contents: read

jobs:
  resume:
    name: Resume exact PR 60 d4edb4b review from saved checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Restore checkpoint from quota-interrupted exact-head review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q08-review-checkpoint-44973396844
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ruthlessjoey/btcidr-trading-lab
          run-id: 44973396844

      - name: Checkout immutable checkpoint-resume reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruthlessjoey/btcidr-trading-lab
          ref: 9ae2e8f24dfe59e16397022a359840d4a11c2300
          path: runner
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/q08_specialist_review.py

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify immutable reviewer syntax
        run: python3 -m py_compile runner/tools/q08_specialist_review.py

      - name: Resume the exact PR 60 review (read-only GitHub source access)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: d4edb4bc634e794b1957399471532ad7671576ba
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          Q08_CHECKPOINT_PATH: ${{ runner.temp }}/q08-review-checkpoint.json
          Q08_RESUME_FROM_RUN_ID: "44972690441"
          Q08_REVIEW_BRANCH: security/q0-provider-sanitization-2026-11-18
        run: python3 runner/tools/q08_specialist_review.py --mode review

      - name: Persist resumable checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q08-review-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/q08-review-checkpoint.json
          if-no-files-found: ignore
          retention-days: 7
