name: Q0.8 resume exact PR #60 head 0f798

on:
  push:
    branches:
      - security/q08-resume-0f798-2026-11-22
    paths:
      - ".github/workflows/q08-resume-checkpoint-44980188862.yml"

permissions:
  contents: read

concurrency:
  group: q08-specialist-review
  cancel-in-progress: false

jobs:
  resume:
    name: Resume current PR #60 review from exact-head checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Restore checkpoint from exact-head failed review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q08-review-checkpoint-44980188862
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 44980188862

      - name: Checkout immutable reviewer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruthlessjoey/btcidr-trading-lab
          ref: security/q08-reviewer-diff-limit-2026-11-22
          path: runner
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/q08_specialist_review.py

      - name: Assert immutable reviewer commit identity
        run: |
          actual="$(git -C runner rev-parse HEAD)"
          expected="21716af3e3248bb64f84fbe40b37b32621e1adfb"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Immutable reviewer checkout SHA mismatch."
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Verify immutable reviewer syntax and checkpoint policy
        run: |
          python3 -m py_compile runner/tools/q08_specialist_review.py
          python3 runner/tools/q08_specialist_review.py --mode synthetic

      - name: Respect the provider's reported reset window
        run: sleep 135

      - name: Resume exact PR #60 current head (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: 0f79801e6fb9105358acdc3330112e6e5fd7e582
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          Q08_CHECKPOINT_PATH: ${{ runner.temp }}/q08-review-checkpoint.json
          Q08_RESUME_FROM_RUN_ID: "44980188862"
          Q08_REVIEW_BRANCH: security/q0-provider-sanitization-2026-11-18
        run: python3 runner/tools/q08_specialist_review.py --mode review

      - name: Persist exact-head resumable checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q08-review-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/q08-review-checkpoint.json
          if-no-files-found: ignore
          retention-days: 7
