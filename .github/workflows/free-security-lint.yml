name: Free workflow security checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-audit:
    name: Static workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install and run actionlint
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSLo actionlint.tar.gz "$url"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Run zizmor with hash-verified dependencies
        uses: zizmorcore/zizmor-action@8aaeb6d158204e73d77eb4b50bcb325641de1bd4
        with:
          version: "1.32.0"
          online-audits: false
          token: ""
          advanced-security: false
          annotations: true
