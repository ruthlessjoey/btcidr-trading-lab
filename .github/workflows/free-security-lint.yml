name: Free workflow security checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-audit:
    name: Static workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sparse checkout only workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/

      - name: Install and run actionlint with verified release digest
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 --retry 2 --retry-all-errors --output "$archive" "$url"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -

          tar -tzf "$archive" | grep -Fxq actionlint
          extract="$RUNNER_TEMP/actionlint-extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract" actionlint
          install -m 0755 "$extract/actionlint" "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" -color

      - name: Run zizmor with hash-verified dependencies and no online audits
        uses: zizmorcore/zizmor-action@8aaeb6d158204e73d77eb4b50bcb325641de1bd4
        with:
          inputs: ".github/workflows"
          collect: workflows
          version: "1.32.0"
          online-audits: false
          token: ""
          advanced-security: false
          annotations: true
          color: false
