      - ".github/workflows/crypto-engine-offline-suite.yml"

permissions:
  contents: read

concurrency:
  group: crypto-engine-offline-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-suite:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: ${{ github.workspace }}/crypto_engine
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Sparse checkout unprotected crypto_engine sources and tests only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /crypto_engine/tmm_core/__init__.py
            /crypto_engine/tmm_core/exposure_policy.py
            /crypto_engine/tmm_core/ingest.py
            /crypto_engine/tmm_core/instrument_registry.py
            /crypto_engine/tmm_core/market_rules.py
            /crypto_engine/tmm_core/multi_market_backtest.py
            /crypto_engine/tmm_core/offline_batch_journal.py
            /crypto_engine/tmm_core/offline_portfolio.py
            /crypto_engine/tmm_core/offline_settlement.py
            /crypto_engine/tmm_core/policy_gateway.py
            /crypto_engine/tmm_core/portfolio.py
            /crypto_engine/tmm_core/provider_policy.py
            /crypto_engine/tmm_core/reservation_allocations.py
            /crypto_engine/tmm_core/reservation_lifecycle.py
            /crypto_engine/tmm_core/reservation_outbox_receiver.py
            /crypto_engine/tmm_core/reservation_schema_v2.py
            /crypto_engine/tmm_core/reservation_migration_preflight.py
            /crypto_engine/tmm_core/reservation_migration.py
            /crypto_engine/tmm_core/risk_gateway.py
            /crypto_engine/tmm_core/risk_overlay.py
            /crypto_engine/tmm_core/session_risk.py
            /crypto_engine/tmm_core/sqlite_settlement_store.py
            /crypto_engine/tmm_core/token_risk.py
            /crypto_engine/tmm_core/tokocrypto_klines.py
            /crypto_engine/tests/__init__.py
            /crypto_engine/tests/test_crypto_data_policy.py
            /crypto_engine/tests/test_crypto_spot_core.py
            /crypto_engine/tests/test_exposure_policy.py
            /crypto_engine/tests/test_instrument_registry.py
            /crypto_engine/tests/test_offline_portfolio.py
            /crypto_engine/tests/test_offline_settlement.py
            /crypto_engine/tests/test_policy_gateway.py
            /crypto_engine/tests/test_reservation_allocations.py
            /crypto_engine/tests/test_reservation_atomic_allocations.py
            /crypto_engine/tests/test_reservation_lifecycle.py
            /crypto_engine/tests/test_reservation_outbox_receiver.py
            /crypto_engine/tests/test_reservation_schema_v2.py
            /crypto_engine/tests/test_reservation_migration_preflight.py
            /crypto_engine/tests/test_reservation_migration.py
            /crypto_engine/tests/test_risk_gateway.py
            /crypto_engine/tests/test_risk_overlay.py
            /crypto_engine/tests/test_session_risk.py
            /crypto_engine/tests/test_sqlite_settlement_store.py
            /crypto_engine/tests/test_token_risk.py

      - name: Set up supported Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          check-latest: false

      - name: Record exact Python and SQLite versions
        run: python -c 'import sqlite3, sys; print("python=" + sys.version.replace("\\n", " ")); print("sqlite=" + sqlite3.sqlite_version)'

      - name: Run the complete isolated crypto_engine test suite
        run: python -m unittest discover -s crypto_engine/tests -p 'test_*.py' -v
