name: Tokocrypto approved public klines boundary

on:
  push:
    branches:
      - security/tokocrypto-klines-only-2026-11-27
      - security/tokocrypto-caller-clock-window-2026-11-27
      - security/tokocrypto-candle-completeness-2026-11-27
    paths:
      - "fetcher.py"
      - "providers.py"
      - "config.json"
      - "tests/test_tokocrypto_endpoint_policy.py"
      - "tokocrypto_public_window.py"
      - "tests/test_tokocrypto_public_window.py"
      - "docs/tokocrypto-public-klines-policy.md"
      - "docs/tokocrypto-candle-completeness.md"
      - ".github/workflows/tokocrypto-endpoint-policy.yml"
  pull_request:
    branches:
      - main
      - security/tokocrypto-klines-only-2026-11-27
      - security/tokocrypto-caller-clock-window-2026-11-27
    paths:
      - "fetcher.py"
      - "providers.py"
      - "config.json"
      - "tests/test_tokocrypto_endpoint_policy.py"
      - "tokocrypto_public_window.py"
      - "tests/test_tokocrypto_public_window.py"
      - "docs/tokocrypto-public-klines-policy.md"
      - ".github/workflows/tokocrypto-endpoint-policy.yml"

permissions:
  contents: read

concurrency:
  group: tokocrypto-endpoint-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-policy-tests:
    name: Offline policy tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Sparse checkout only unprotected policy files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetcher.py
            /providers.py
            /config.json
            /tests/test_tokocrypto_endpoint_policy.py
            /tokocrypto_public_window.py
            /tests/test_tokocrypto_public_window.py
            /tests/test_fetcher.py

      - name: Set up supported Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Run safe offline fetcher regression tests
        run: python -m unittest discover -s tests -p 'test_fetcher.py' -v

      - name: Run synthetic Tokocrypto policy tests only
        run: python -m unittest discover -s tests -p 'test_tokocrypto_endpoint_policy.py' -v

      - name: Run caller-clock Tokocrypto candle-window tests
        run: python -m unittest discover -s tests -p 'test_tokocrypto_public_window.py' -v
