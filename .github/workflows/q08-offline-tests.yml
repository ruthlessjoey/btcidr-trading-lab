name: Q0.8 offline security regression tests (approved unprotected subset)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q08-offline-security-tests
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout only the approved fetcher test surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetcher.py
            /tests/test_fetcher.py

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Run the approved offline fetcher security tests
        run: python3 -m unittest discover -s tests -p 'test_fetcher.py' -v
