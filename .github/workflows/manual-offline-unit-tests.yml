name: Manual Offline Holdout Publisher Tests (protected-path-safe)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holdout-publisher-offline-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  holdout-publisher-tests:
    name: Holdout publisher tests only (no protected imports)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Sparse checkout only the publisher and its isolated test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/__init__.py
            /research/holdout_publish.py
            /tests/test_holdout_publish.py

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Run the isolated holdout publisher tests
        run: python -m unittest discover -s tests -p 'test_holdout_publish.py' -v
