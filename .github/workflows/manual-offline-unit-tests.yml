name: Manual Offline Unit Tests (approved unprotected subset)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-offline-unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Fetcher transport tests only (no protected imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Sparse checkout only the approved fetcher test surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetcher.py
            /tests/test_fetcher.py

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Run the approved offline fetcher tests
        run: python -m unittest discover -s tests -p 'test_fetcher.py' -v
