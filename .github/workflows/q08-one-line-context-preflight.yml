name: Q0.8 one-line-context immutable reviewer preflight

on:
  push:
    branches:
      - security/q08-immutable-reviewer-with-event-gate-2026-11-23
    paths:
      - "tools/q08_specialist_review.py"
      - ".github/workflows/q08-one-line-context-preflight.yml"

permissions:
  contents: read

concurrency:
  group: q08-one-line-context-preflight
  cancel-in-progress: false

jobs:
  synthetic-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the immutable reviewer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruthlessjoey/btcidr-trading-lab
          ref: e76faed3520ea3dce0b06dfb5bc64ca5ad3554aa
          path: runner
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/q08_specialist_review.py

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          check-latest: false

      - name: Compile immutable reviewer
        run: python3 -m py_compile runner/tools/q08_specialist_review.py

      - name: Run synthetic policy, checkpoint and one-line-diff regression
        run: python3 runner/tools/q08_specialist_review.py --mode synthetic
