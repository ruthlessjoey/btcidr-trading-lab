name: Q0.8 resume saved checkpoint 44974696738

on:
  push:
    branches:
      - security/q08-push-checkpoint-resume-2026-11-22
    paths:
      - .github/workflows/q08-resume-checkpoint-44974696738.yml

permissions:
  contents: read

jobs:
  resume:
    name: Resume exact PR 60 b9da90b review from newest saved checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Restore newest exact-head checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q08-review-checkpoint-44974696738
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ruthlessjoey/btcidr-trading-lab
          run-id: 44974696738

      - name: Checkout immutable checkpoint-resume reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruthlessjoey/btcidr-trading-lab
          ref: 9ae2e8f24dfe59e16397022a359840d4a11c2300
          path: runner
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/q08_specialist_review.py

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Verify immutable reviewer syntax and checkpoint policy
        run: |
          python3 -m py_compile runner/tools/q08_specialist_review.py
          python3 runner/tools/q08_specialist_review.py --mode synthetic

      - name: Resume exact current PR 60 review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: b9da90b91e49970e8c662771fa6c589f151eda25
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          Q08_CHECKPOINT_PATH: ${{ runner.temp }}/q08-review-checkpoint.json
          Q08_RESUME_FROM_RUN_ID: "44973807749"
          Q08_REVIEW_BRANCH: security/q0-provider-sanitization-2026-11-18
        run: python3 runner/tools/q08_specialist_review.py --mode review

      - name: Persist resumable checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q08-review-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/q08-review-checkpoint.json
          if-no-files-found: ignore
          retention-days: 7
