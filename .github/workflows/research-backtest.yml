name: Research backtest (blocked pending protected engine review)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout only approved unprotected offline test dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetcher.py
            /providers.py
            /probe.py
            /config.json
            /research_config.json
            /research/history.py
            /research/crosscheck.py
            /fetch_history.py
            /tests/test_fetcher.py
            /tests/test_live_check.py
            /tests/test_history.py
            /tests/test_probe.py
            /tests/test_pipeline.py
            /tests/test_research_gates.py

      - name: Run the approved offline tests only
        run: |
          python3 -m unittest discover -s tests -p 'test_fetcher.py' -v
          python3 -m unittest discover -s tests -p 'test_live_check.py' -v
          python3 -m unittest discover -s tests -p 'test_history.py' -v
          python3 -m unittest discover -s tests -p 'test_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_research_gates.py' -v

      - name: Record why Step 2 is blocked without importing protected modules
        run: |
          mkdir -p out
          cat > out/backtest-blocked.md <<'EOF'
          # Research backtest blocked

          Step 2 remains disabled because its current import chain reaches the protected
          root-level validator.py through research.pipeline -> research.engine.

          This workflow intentionally does not check out research-data, import the engine,
          execute run_backtest.py, read protected files, or evaluate any backtest.

          Resume only after the protected-module boundary is separately reviewed and
          the owner authorizes the required access.
          EOF
          cat "$GITHUB_WORKSPACE/out/backtest-blocked.md" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Preserve the blocker report as a run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backtest-blocked-report
          path: out/backtest-blocked.md
          if-no-files-found: ignore
