name: Research backtest (Step 2)

# READ-ONLY research. TEST evaluation requires a reservation committed to research-data first.
# Results are append-only; no force-push is used.
on:
  workflow_dispatch:
  push:
    branches: [milestone-3-data]
    paths: [run_backtest.py, run_crosscheck.py, backtest_config.json, "research/**",
            ".github/workflows/research-backtest.yml"]

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Offline unit tests (must pass before anything runs on real data)
        run: python3 -m unittest discover -s tests -v

      - name: Load preserved datasets and earlier test records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prev
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 "$URL" research-data
          git archive FETCH_HEAD datasets | tar -x -C prev
          git archive FETCH_HEAD test_evaluations 2>/dev/null | tar -x -C prev || true
          mkdir -p prev/test_evaluations

      - name: Cross-check flagged candles against independent sources
        continue-on-error: true
        run: python3 run_crosscheck.py --datasets-root prev/datasets

      - name: Prepare holdout reservation (does not evaluate TEST)
        run: |
          set -euo pipefail
          python3 run_backtest.py --datasets-root prev/datasets --prev-results prev --crosscheck out/crosscheck.json --prepare-reservation

      - name: Persist reservation before TEST evaluation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          markers=("$GITHUB_WORKSPACE"/out/test_evaluations/*.pending)
          if [ "${#markers[@]}" -eq 0 ]; then
            echo "No TEST reservation was prepared; TEST will not be evaluated."
            exit 0
          fi
          if [ "${#markers[@]}" -ne 1 ]; then
            echo "Expected exactly one prepared reservation; refusing."
            exit 1
          fi
          marker="${markers[0]}"
          name="$(basename "$marker")"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/reservation-pub
          git clone -q --depth 1 --branch research-data "$URL" /tmp/reservation-pub
          cd /tmp/reservation-pub
          mkdir -p test_evaluations
          key="${name%.pending}"
          if [ -e "test_evaluations/$name" ] || [ -L "test_evaluations/$name" ] || [ -e "test_evaluations/$key.json" ] || [ -L "test_evaluations/$key.json" ]; then
            echo "A completed record or reservation already exists; refusing TEST evaluation."
            exit 1
          fi
          cp "$marker" "test_evaluations/$name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "test_evaluations/$name"
          git commit -m "Reserve holdout evaluation $key"
          git push "$URL" HEAD:research-data
          mkdir -p "$GITHUB_WORKSPACE/prev/test_evaluations"
          git show "HEAD:test_evaluations/$name" > "$GITHUB_WORKSPACE/prev/test_evaluations/$name"

      - name: Evaluate TEST only with the committed reservation
        if: success()
        run: |
          set -euo pipefail
          python3 run_backtest.py --datasets-root prev/datasets --prev-results prev --crosscheck out/crosscheck.json --require-committed-reservation

      - name: Keep the reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: out/
          if-no-files-found: ignore

      - name: Publish results and clear only matching completed reservations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/pub
          git clone -q --depth 1 --branch research-data "$URL" /tmp/pub
          cd /tmp/pub
          R=results/${{ github.run_id }}-${{ github.run_attempt }}
          mkdir -p "$R" test_evaluations
          cp "$GITHUB_WORKSPACE"/out/*.md "$GITHUB_WORKSPACE"/out/*.json "$GITHUB_WORKSPACE"/out/*.csv "$R"/ 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/out/test_evaluations" ]; then
            cp -n "$GITHUB_WORKSPACE"/out/test_evaluations/*.json test_evaluations/ 2>/dev/null || true
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("test_evaluations")
          import os
          output = Path(os.environ["GITHUB_WORKSPACE"]) / "out" / "test_evaluations"
          if output.is_dir():
              for completed in output.glob("*.json"):
                  pending = root / (completed.stem + ".pending")
                  if not pending.exists() or pending.is_symlink() or not pending.is_file():
                      continue
                  if completed.is_symlink() or not completed.is_file():
                      raise SystemExit("completed record is not a regular file")
                  reservation_record = json.loads(pending.read_text(encoding="utf-8"))
                  completed_record = json.loads(completed.read_text(encoding="utf-8"))
                  fields = ("key", "frozen_hash", "run_id", "run_attempt", "workflow_ref", "repository")
                  if reservation_record.get("status") != "reserved" or completed_record.get("status") != "evaluated":
                      raise SystemExit("reservation/completion status mismatch")
                  if reservation_record.get("key") != completed.stem or completed_record.get("key") != completed.stem:
                      raise SystemExit("reservation/completion filename does not match its key")
                  if any(reservation_record.get(k) != completed_record.get(k) for k in fields):
                      raise SystemExit("completed record does not match its durable reservation")
                  pending.unlink()
          PY
          cp "$GITHUB_WORKSPACE"/out/backtest_report.md LATEST_BACKTEST_REPORT.md 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/out/crosscheck.md LATEST_CROSSCHECK.md 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "Backtest run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
          git push "$URL" HEAD:research-data
