name: Research backtest (Step 2)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Load the preserved research-data branch without write credentials
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: prev
          persist-credentials: false

      - name: Backtest the pinned local dataset (no cross-check providers authorized)
        run: python3 run_backtest.py --datasets-root prev/datasets --prev-results prev

      - name: Keep reports and logs as a run artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: out/
          if-no-files-found: ignore
