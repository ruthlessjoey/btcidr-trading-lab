name: Research backtest (Step 2)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run authorized offline tests (no protected validator import)
        run: |
          python3 -m unittest discover -s tests -p 'test_fetcher.py' -v
          python3 -m unittest discover -s tests -p 'test_live_check.py' -v
          python3 -m unittest discover -s tests -p 'test_history.py' -v
          python3 -m unittest discover -s tests -p 'test_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_research_gates.py' -v
          python3 -m unittest discover -s tests -p 'test_engine.py' -v
          python3 -m unittest discover -s tests -p 'test_backtest_pipeline.py' -v

      - name: Load the preserved research-data branch without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research-data
          path: prev
          persist-credentials: false

      - name: Backtest the pinned local dataset (no cross-check providers authorized)
        run: python3 run_backtest.py --datasets-root prev/datasets --prev-results prev

      - name: Keep reports and logs as a run artifact only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backtest-report
          path: out/
          if-no-files-found: ignore
