name: Q0.8 immutable 19-role specialist review

on:
  # Manual dispatch remains available for owner-directed recovery.
  workflow_dispatch:
    inputs:
      review_head_sha:
        description: "Exact immutable PR #60 commit SHA to review"
        required: true
        type: string
      resume_from_run_id:
        description: "Optional prior run ID containing a checkpoint for this exact review head"
        required: false
        type: string
      mode:
        description: "Run synthetic preflight only, or continue to the full 19-role review"
        required: true
        type: choice
        options:
          - synthetic
          - review
        default: synthetic
  # The PR60 offline workflow runs without secrets. This trusted default-branch workflow
  # starts the model review only after that exact offline workflow succeeds.
  workflow_run:
    workflows:
      - "Q0.8 offline security regression tests (sparse unprotected scope)"
    types: [completed]
    branches:
      - security/q0-provider-sanitization-2026-11-18


permissions:
  contents: read

concurrency:
  group: q08-specialist-review
  cancel-in-progress: false

jobs:
  review:
    name: Bounded read-only 19-role review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'security/q0-provider-sanitization-2026-11-18' &&
        github.event.workflow_run.workflow_id == 421573668 &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Validate checkpoint run ID before artifact restore
        if: ${{ inputs.mode == 'review' && inputs.resume_from_run_id != '' }}
        env:
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RESUME_FROM_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::resume_from_run_id must be a numeric GitHub Actions run ID."
            exit 1
          fi

      - name: Sparse checkout only the immutable self-contained reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruthlessjoey/btcidr-trading-lab
          ref: cf9f319bc86155e7669f2cf0ced5d4df53cebffa
          path: runner
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/q08_specialist_review.py

      - name: Restore checkpoint from an earlier run
        if: ${{ inputs.mode == 'review' && inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q08-review-checkpoint-${{ inputs.resume_from_run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_from_run_id }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Verify trusted runner syntax
        run: python3 -m py_compile runner/tools/q08_specialist_review.py

      - name: Run synthetic policy smoke test
        run: python3 runner/tools/q08_specialist_review.py --mode synthetic

      - name: Validate trusted offline-test workflow completion before using its commit
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_ID: "421573668"
          EXPECTED_BRANCH: "security/q0-provider-sanitization-2026-11-18"
          EXPECTED_WORKFLOW_NAME: "Q0.8 offline security regression tests (sparse unprotected scope)"
          EXPECTED_WORKFLOW_BLOB: "4821963a7b752a1e5bbc52e1d97c93ea296ff7f4"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          try:
              with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as stream:
                  event = json.load(stream)
              run = event["workflow_run"]
              expected_repo = "ruthlessjoey/btcidr-trading-lab"
              if os.environ["REVIEW_REPOSITORY"] != expected_repo:
                  raise ValueError("unexpected repository")
              checks = (
                  run.get("workflow_id") == int(os.environ["EXPECTED_WORKFLOW_ID"]),
                  run.get("name") == os.environ["EXPECTED_WORKFLOW_NAME"],
                  run.get("event") == "push",
                  run.get("conclusion") == "success",
                  run.get("head_branch") == os.environ["EXPECTED_BRANCH"],
                  (run.get("head_repository") or {}).get("full_name") == expected_repo,
                  (run.get("repository") or {}).get("full_name") == expected_repo,
                  isinstance(run.get("head_sha"), str)
                      and re.fullmatch(r"[0-9a-f]{40}", run["head_sha"]),
                  type(run.get("id")) is int and run["id"] > 0,
              )
              if not all(checks):
                  raise ValueError("upstream workflow run identity or conclusion mismatch")
              sha = run["head_sha"]
              url = (
                  "https://api.github.com/repos/" + expected_repo
                  + "/contents/.github/workflows/q08-offline-tests.yml?ref=" + sha
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "q08-trusted-workflow-run-gate",
                  },
                  method="GET",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read(65537)
              if len(body) > 65536:
                  raise ValueError("offline workflow metadata response exceeded limit")
              content = json.loads(body.decode("utf-8"))
              if content.get("sha") != os.environ["EXPECTED_WORKFLOW_BLOB"]:
                  raise ValueError("PR branch offline workflow is not the approved immutable blob")
              print("Trusted workflow_run event validated for exact head " + sha)
          except (KeyError, TypeError, ValueError, OSError, urllib.error.URLError,
                  json.JSONDecodeError) as exc:
              print("::error::Trusted Q0.8 workflow_run validation failed: " + type(exc).__name__)
              raise SystemExit(1)
          PY

      - name: Run immutable branch review (read-only GitHub access; model receives scoped diffs)
        if: ${{ github.event_name == 'workflow_run' || inputs.mode == 'review' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.review_head_sha }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          Q08_CHECKPOINT_PATH: ${{ runner.temp }}/q08-review-checkpoint.json
          Q08_RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id || '' }}
        run: python3 runner/tools/q08_specialist_review.py --mode review

      - name: Persist resumable review checkpoint
        if: ${{ always() && (github.event_name == 'workflow_run' || inputs.mode == 'review') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q08-review-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/q08-review-checkpoint.json
          if-no-files-found: ignore
          retention-days: 7
